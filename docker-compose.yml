services:
  db:
    # pgvector image keeps local dev on the same vector-capable Postgres as Neon (ADR-005)
    image: pgvector/pgvector:pg17
    container_name: syllabai-db
    environment:
      POSTGRES_USER: syllabai
      POSTGRES_PASSWORD: syllabai
      POSTGRES_DB: syllabai
    ports:
      - "5432:5432"
    volumes:
      - syllabai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syllabai -d syllabai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  syllabai_pgdata:
