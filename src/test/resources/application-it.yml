# Integration-test profile: Testcontainers supplies the datasource (@ServiceConnection).
spring:
  flyway:
    clean-disabled: false

syllabai:
  security:
    jwt-secret: it-only-secret-change-me-0123456789abcdef0123456789abcdef
  seed:
    demo-users:
      enabled: false
  # ITs fire many same-learner LLM asks in one minute (flow suites, e2e
  # payload assertions); the limiter itself is unit-tested directly
  ratelimit:
    enabled: false
  # telemetry dispatch (audit M1): production dispatches the research-record
  # listeners on a bounded pool; tests pin the pre-M1 inline dispatch so flow
  # ITs (KaRagFlowIT, ClaFlowIT, MultipartMarkingFlowIT,
  # EvidenceStateConcurrencyIT) can assert telemetry rows deterministically
  # right after the act
  telemetry:
    dispatch: sync

logging:
  level:
    com.syllabai: INFO
