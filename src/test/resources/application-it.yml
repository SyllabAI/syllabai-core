# Integration-test profile: Testcontainers supplies the datasource (@ServiceConnection).
spring:
  flyway:
    clean-disabled: false

syllabai:
  security:
    jwt-secret: it-only-secret-change-me-0123456789abcdef0123456789abcdef
  seed:
    demo-users:
      enabled: false
  # ITs fire many same-learner LLM asks in one minute (flow suites, e2e
  # payload assertions); the limiter itself is unit-tested directly
  ratelimit:
    enabled: false

logging:
  level:
    com.syllabai: INFO
