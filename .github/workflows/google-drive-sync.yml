name: Google Drive Sync

# Syncs the entire repository to Google Drive on every push to any branch.
#
# Two auth modes (checked in this order):
#   1. OAuth (personal Drive, works with free Gmail):
#        secret GDRIVE_RCLONE_OAUTH = rclone config block ([gdrive] type=drive ... token=...)
#        optional variable GDRIVE_FOLDER_ID = target folder ID (pinned via --drive-root-folder-id)
#   2. Service account (requires a Workspace SHARED DRIVE - Google blocks SA uploads
#      to personal My Drive with "Service Accounts do not have storage quota"):
#        secret GDRIVE_SERVICE_ACCOUNT = service-account JSON key
#        variable GDRIVE_TEAM_DRIVE    = shared drive ID
#
# Until a credential exists this workflow exits gracefully with a notice.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdrive-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check prerequisites
        id: prereq
        env:
          SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          RCLONE_OAUTH: ${{ secrets.GDRIVE_RCLONE_OAUTH }}
        run: |
          if [ -n "$RCLONE_OAUTH" ]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$SA_JSON" ]; then
            echo "mode=sa" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Google credential found (set secret GDRIVE_RCLONE_OAUTH or GDRIVE_SERVICE_ACCOUNT) - sync skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install rclone
        if: steps.prereq.outputs.skip == 'false'
        run: |
          curl -sSL --retry 3 -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          cd /tmp && unzip -o -q rclone.zip
          sudo cp /tmp/rclone-*/rclone /usr/local/bin/rclone
          sudo chmod 755 /usr/local/bin/rclone
          rclone version | head -2

      - name: Configure rclone
        if: steps.prereq.outputs.skip == 'false'
        env:
          SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          RCLONE_OAUTH: ${{ secrets.GDRIVE_RCLONE_OAUTH }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          if [ "${{ steps.prereq.outputs.mode }}" = "sa" ]; then
            echo "Auth mode: service account (Shared Drive required)"
            printf '%s' "$SA_JSON" > "$HOME/gdrive-sa.json"
            chmod 600 "$HOME/gdrive-sa.json"
            {
              echo "[gdrive]"
              echo "type = drive"
              echo "scope = drive"
              echo "service_account_file = $HOME/gdrive-sa.json"
            } > "$HOME/.config/rclone/rclone.conf"
          else
            echo "Auth mode: OAuth (personal Drive)"
            printf '%s\n' "$RCLONE_OAUTH" > "$HOME/.config/rclone/rclone.conf"
          fi

      - name: Sync repository to Google Drive
        if: steps.prereq.outputs.skip == 'false'
        env:
          FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          TEAM_DRIVE: ${{ vars.GDRIVE_TEAM_DRIVE }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -o pipefail
          EXCLUDES=(
            --exclude ".git/**"
            --exclude "node_modules/**"
            --exclude "__pycache__/**"
            --exclude ".venv/**"
            --exclude "venv/**"
            --exclude "*.pyc"
          )
          DEST="gdrive:SyllabAI-GitHub/$REPO"
          EXTRA=""
          if [ -n "$TEAM_DRIVE" ]; then
            echo "Destination: Shared Drive $TEAM_DRIVE / $REPO"
            EXTRA="--drive-team-drive=$TEAM_DRIVE"
            DEST="gdrive:$REPO"
          elif [ -n "$FOLDER_ID" ]; then
            echo "Destination: Drive folder $FOLDER_ID / $REPO"
            EXTRA="--drive-root-folder-id=$FOLDER_ID"
            DEST="gdrive:$REPO"
          else
            echo "Destination: $DEST (by name)"
          fi
          rclone sync . "$DEST" "${EXCLUDES[@]}" $EXTRA \
            --transfers 8 --checkers 16 --fast-list \
            --stats-one-line --stats 30s -v 2>&1 | tee /tmp/rclone.log \
          || {
            if grep -q "storage quota" /tmp/rclone.log; then
              echo "::error::Google blocks service-account uploads to personal My Drive. Fix: (A) Workspace Shared Drive -> add SA as Content Manager, set repo variable GDRIVE_TEAM_DRIVE to its ID; or (B) OAuth -> set secret GDRIVE_RCLONE_OAUTH. See GOOGLE_DRIVE_SETUP_GUIDE.md."
            fi
            if [ -z "$EXTRA" ]; then
              echo "::notice::Retrying with --drive-shared-with-me"
              rclone sync . "$DEST" "${EXCLUDES[@]}" --drive-shared-with-me \
                --transfers 8 --checkers 16 --fast-list \
                --stats-one-line --stats 30s -v
            else
              exit 1
            fi
          }

      - name: Sync summary
        if: steps.prereq.outputs.skip == 'false' && always()
        run: |
          echo "### Google Drive sync result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${{ github.event.repository.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth mode: \`${{ steps.prereq.outputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Log tail:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 15 /tmp/rclone.log 2>/dev/null || echo "(no log - skipped)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
