name: Discord Commit Notify

# Posts an embed to a Discord channel whenever commits land on the default
# branch. Uses a Discord webhook (free, no bot required):
#   secret DISCORD_WEBHOOK_URL = https://discord.com/api/webhooks/...
# If the secret is absent the job exits gracefully (no failures).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-notify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send commit updates to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ toJSON(github.event) }}
          REPO: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          wh = os.environ.get("WEBHOOK", "")
          if not wh:
              print("::notice::DISCORD_WEBHOOK_URL not set - commit notify skipped")
              raise SystemExit(0)
          ev = json.loads(os.environ["EVENT"])
          commits = [c for c in (ev.get("commits") or []) if c.get("distinct", True)]
          if not commits:
              print("no distinct commits - nothing to send")
              raise SystemExit(0)

          # Skip automation-only pushes (workflows / dashboard scripts):
          # announce real code changes only. Push events made via the API omit
          # per-commit file paths, so use fast path when present, else the
          # Compare API (before...after) for the definitive file list.
          auto = (".github/", "scripts/")
          def all_auto(paths):
              return bool(paths) and all(p.startswith(auto) for p in paths)
          event_paths = []
          for c in commits:
              event_paths += (c.get("added") or []) + (c.get("modified") or []) + (c.get("removed") or [])
          if all_auto(event_paths):
              print("automation-only push (workflows/scripts) - skipped")
              raise SystemExit(0)
          before, after = ev.get("before") or "", ev.get("after") or ""
          zero = "0" * 40
          if before and after and before != zero and after != zero:
              try:
                  creq = urllib.request.Request(
                      f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/compare/{before}...{after}",
                      headers={"Authorization": f"token {os.environ['GH_TOKEN']}",
                               "Accept": "application/vnd.github+json",
                               "User-Agent": "syllabai-notify"})
                  cmp = json.loads(urllib.request.urlopen(creq, timeout=30).read().decode())
                  files = [f.get("filename", "") for f in cmp.get("files", [])]
                  if all_auto(files):
                      print("automation-only push (workflows/scripts) - skipped (compare)")
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  print(f"compare check failed ({e}) - proceeding with notification")

          branch = (ev.get("ref") or "").replace("refs/heads/", "")
          pusher = (ev.get("pusher") or {}).get("name", "unknown")
          repo = os.environ["REPO"]

          lines = []
          for c in commits[:10]:
              msg = (c.get("message") or "").splitlines()[0][:120]
              a = c.get("author") or {}
              author = a.get("name") or a.get("username") or "?"
              lines.append(f"[`{c['id'][:7]}`]({c['url']}) {msg} — **{author}**")
          extra = len(commits) - 10
          if extra > 0:
              lines.append(f"*…and {extra} more*")

          payload = {
              "username": "SyllabAI Commits",
              "embeds": [{
                  "title": f"{repo} · {len(commits)} new commit"
                           f"{'s' if len(commits) != 1 else ''} → {branch}",
                  "url": ev.get("compare") or f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/commits/{branch}",
                  "description": "\n".join(lines),
                  "color": 3447003,
                  "footer": {"text": f"pushed by {pusher} · mirroring to Google Drive"},
              }],
          }
          req = urllib.request.Request(wh, data=json.dumps(payload).encode(),
                                       headers={"Content-Type": "application/json",
                                                "User-Agent": "SyllabAI-Notifier/1.0 (+https://github.com/SyllabAI)"})
          try:
              urllib.request.urlopen(req, timeout=15)
              print(f"[OK] posted {len(commits)} commits to Discord")
          except Exception as e:
              print(f"::notice::Discord webhook failed (non-fatal): {e}")
          PY
